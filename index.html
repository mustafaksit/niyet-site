<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niyet</title>
<meta name="description" content="Niyet is a simple app that helps you find the right dua for your situation, according to the Hanafi school. Every dua is based on a specific source; no dua without a source can enter the app.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root {
  --bg: #F6F1E8;
  --bg-elevated: #FDFAF4;
  --text: #1F2A22;
  --text-secondary: #5C665D;
  --accent: #B8923E;
  --accent-soft: #EADFC4;
  --border: #E2DACB;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131714;
    --bg-elevated: #1C211D;
    --text: #EFE9DD;
    --text-secondary: #A8AEA6;
    --accent: #D4B265;
    --accent-soft: #2C2A1F;
    --border: #2A302B;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Lora', Georgia, 'Times New Roman', serif;
  font-size: 16px;
  line-height: 25px;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 32px 16px 56px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; }
.brand { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 20px; color: var(--text); text-decoration: none; }
h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; color: var(--text); }
h1 { font-size: 34px; line-height: 40px; margin: 0 0 8px; }
h2 { font-size: 20px; line-height: 26px; margin: 32px 0 8px; }
p { margin: 0 0 12px; }
.lead p { font-size: 18px; line-height: 28px; }
.meta { color: var(--text-secondary); font-size: 14px; line-height: 21px; margin: 0 0 24px; }
a { color: var(--text); text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; }
a:hover { text-decoration-color: var(--text); }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-elevated); padding: 2px; }
.toggle button {
  font: 500 13px/18px 'Lora', Georgia, serif;
  color: var(--text-secondary);
  background: transparent;
  border: 0;
  border-radius: 999px;
  min-width: 44px;
  min-height: 32px;
  padding: 0 12px;
  cursor: pointer;
}
.toggle button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
.toggle button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 24px; padding: 24px; margin-top: 32px; }
.card h2 { margin-top: 0; }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 14px; line-height: 21px; }
footer a { margin-right: 16px; }
/* Dil seçimi: JS yoksa iki dil de görünür. */
html[data-lang="en"] [data-l="tr"], html[data-lang="tr"] [data-l="en"] { display: none; }
</style>

</head>
<body>
<div class="wrap">
<header class="top">
<a class="brand" href="index.html">Niyet</a>

</header>
<main>
<h1>Niyet</h1>
<div class="lead"><p>Niyet is a simple app that helps you find the right dua for your situation, according to the Hanafi school. Every dua is based on a specific source; no dua without a source can enter the app.</p></div>
<ul>
<li><a href="privacy.html">Privacy Policy</a> (<a href="privacy.html?lang=tr" lang="tr">Gizlilik Politikası</a>)</li>
<li><a href="about.html">About and Support</a> (<a href="about.html?lang=tr" lang="tr">Hakkında ve Destek</a>)</li>
</ul>
</main>

</div>
</body>
</html>
